name: Package Simulacra Skill

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and package
        run: python scripts/package_skill.py
      - name: Upload downloadable packages
        uses: actions/upload-artifact@v4
        with:
          name: simulacra-distribution
          path: |
            dist/simulacra.skill
            dist/simulacra.zip
            dist/simulacra-chatgpt.zip
          if-no-files-found: error
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/simulacra.skill dist/simulacra.zip dist/simulacra-chatgpt.zip --generate-notes --verify-tag
